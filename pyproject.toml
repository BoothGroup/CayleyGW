[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cayleygw"
version = "1.0.0"
description = "Cayley-moment G0W0 for closed-shell molecules on top of PySCF"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Marcus K. Allen", email = "marcus.allen@kcl.ac.uk" },
    { name = "George H. Booth", email = "george.booth@kcl.ac.uk" },
]
keywords = ["GW", "moment-conserving GW", "Cayley transform", "quantum chemistry", "PySCF"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyscf>=2.7",
    # Required, not optional: it holds every stage to `native_threads` BLAS and
    # LAPACK threads, and an unbounded native layer makes the block-Toeplitz
    # rank test, and therefore the realization, depend on the machine.
    "threadpoolctl>=3.1",
    # Draws the console log in both styles.
    "rich>=13",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
test = [
    "matplotlib>=3.8",
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/BoothGroup/CayleyGW"
Paper = "https://arxiv.org/abs/2609.29271"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "pyscf: tests that run molecular PySCF calculations",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "D",  # pydocstyle
    "PL", # pylint
]
ignore = [
    "D105",     # undocumented-magic-method: the dataclass __post_init__ validators
    "D107",     # undocumented-public-init
    "D202",     # blank-line-after-function: every docstring here is followed by one
    "E731",     # lambda-assignment
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
    "PLW2901",  # redefined-loop-name
]

[tool.ruff.lint.per-file-ignores]
# Imports deferred on purpose: optional matplotlib, a lazy probe, an import cycle.
"src/cayleygw/_helpers/pyscf.py" = ["PLC0415"]
"src/cayleygw/_helpers/tools/logfile.py" = ["PLC0415"]
"src/cayleygw/tools/spectrum.py" = ["PLC0415"]
# Process-wide thread-limit state.
"src/cayleygw/_helpers/tools/threadpool.py" = ["PLW0603"]
"src/cayleygw/tools/parallel.py" = ["PLW0603"]
"tests/**/*.py" = [
    "D103",     # undocumented-public-function
    "PLC0415",  # import-outside-top-level
]
"examples/**/*.py" = [
    "D103",  # undocumented-public-function
    "E501",  # line-too-long
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["cayleygw"]
